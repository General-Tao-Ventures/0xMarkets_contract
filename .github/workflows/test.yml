name: Test

on:
  pull_request:
  push:
    branches: [main, master, audit/fixes, dev]

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.0.0"

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            if yarn install; then
              exit 0
            fi
            echo "yarn install failed (attempt $i/3); retrying in 10 seconds..."
            sleep 10
          done
          echo "yarn install failed after 3 attempts"
          exit 1

      - name: Compile contracts
        run: yarn hardhat compile && yarn hardhat deploy

      - name: Run tests
        run: yarn hardhat test
